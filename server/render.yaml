services:
  - type: web
    name: pypose-squat-vision-ai
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: COMPLEXITY
        value: 0

